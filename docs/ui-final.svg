<?xml version="1.0" encoding="UTF-8"?>
<!--
  三国麻雀 · 局内界面（按口述重做后的布局）
  浏览器直接打开本文件即可查看。
  要点：左上角宝牌/场供；中央方块四周环绕牌河；左右家竖排（旋转 90°）；所有内容居中；无日志。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
